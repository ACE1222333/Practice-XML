<!DOCTYPE html>
<html>
    <body>
        <p id="demo"></p>
        <button onclick="loadXml()">Click This to see Planets</button>
    <script>
        function loadXml() {
             var xhttp = new XMLHttpRequest(); //Has a built in parser

             xhttp.onreadystatechange = function() {
                if(this.readyState == 4 & this.status == 200) {
                    myFunction(this);
                }
             };
             xhttp.open("GET","planets.xml", true);
             xhttp.send();
             
        }

        function myFunction(xml) {
            var text, parser, xmlDoc, x, txt;
            xmlDoc = xml.responseXML;
            txt = ""; //Where the xml object will be stored after converting into string
            x = xmlDoc.getElementsByTagName("size");
            for (i = 0; i < x.length; i++) {
            txt += x[i].childNodes[0].nodeValue + "<br>";
            document.getElementById("demo").innerHTML = txt + x.length;
            }
        }
